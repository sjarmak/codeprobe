name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CODEPROBE_RELEASE_MAX_COST_USD: ${{ vars.CODEPROBE_RELEASE_MAX_COST_USD || '1.25' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=src/codeprobe --cov-report=term-missing --cov-fail-under=80
        env:
          CODEPROBE_TENANT: ci-${{ github.sha }}

  # Zero-cost wiring coverage remains a normal release prerequisite, but its
  # e2e-stub producer can never create the retained release evidence below.
  e2e-self-serve:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/e2e/self_serve_acceptance.py

  # Protected real-agent gate. The wheel uploaded here is the exact wheel the
  # clean venv installs and the exact wheel the publish job later receives.
  e2e-enterprise:
    needs: [test, e2e-self-serve]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-real-agent
    permissions:
      contents: read
    env:
      CODEPROBE_RELEASE_AGENT: ${{ vars.CODEPROBE_RELEASE_AGENT || 'claude' }}
      CODEPROBE_RELEASE_CREDENTIAL_ENV: ${{ vars.CODEPROBE_RELEASE_CREDENTIAL_ENV || 'ANTHROPIC_API_KEY' }}
      CODEPROBE_RELEASE_AGENT_IMAGE: ${{ vars.CODEPROBE_RELEASE_AGENT_IMAGE }}
      CODEPROBE_RELEASE_SCORING_IMAGE: ${{ vars.CODEPROBE_RELEASE_SCORING_IMAGE }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Clean-wheel real-agent enterprise journey
        env:
          CODEPROBE_RELEASE_AGENT_CREDENTIAL: ${{ secrets.CODEPROBE_RELEASE_AGENT_CREDENTIAL }}
        run: >-
          python scripts/e2e/enterprise_journey.py
          --wheel dist/codeprobe-*.whl
          --candidate-version "${GITHUB_REF_NAME#v}"
          --candidate-commit "$GITHUB_SHA"
          --agent "$CODEPROBE_RELEASE_AGENT"
          --credential-env "$CODEPROBE_RELEASE_CREDENTIAL_ENV"
          --agent-image "$CODEPROBE_RELEASE_AGENT_IMAGE"
          --scoring-image "$CODEPROBE_RELEASE_SCORING_IMAGE"
          --max-cost-usd "$CODEPROBE_RELEASE_MAX_COST_USD"
          --out enterprise-evidence/enterprise-journey.json
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dist
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-journey-evidence
          path: enterprise-evidence/enterprise-journey.json
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: [e2e-enterprise]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CODEPROBE_RELEASE_AGENT_IMAGE: ${{ vars.CODEPROBE_RELEASE_AGENT_IMAGE }}
      CODEPROBE_RELEASE_SCORING_IMAGE: ${{ vars.CODEPROBE_RELEASE_SCORING_IMAGE }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dist
          path: candidate-dist/
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: enterprise-journey-evidence
          path: enterprise-evidence/
      - run: pip install build twine
      - run: python -m build --sdist --outdir candidate-dist
      - run: twine check candidate-dist/*
      - run: >-
          python scripts/check_release_artifacts.py candidate-dist/
          --version "${GITHUB_REF_NAME#v}"
      - name: Validate candidate-bound real-agent evidence
        run: >-
          python scripts/enterprise_release_gate.py
          --evidence enterprise-evidence/enterprise-journey.json
          --wheel candidate-dist/codeprobe-*.whl
          --expected-version "${GITHUB_REF_NAME#v}"
          --expected-commit "$GITHUB_SHA"
          --expected-agent-image "$CODEPROBE_RELEASE_AGENT_IMAGE"
          --expected-scoring-image "$CODEPROBE_RELEASE_SCORING_IMAGE"
          --max-cost-usd "$CODEPROBE_RELEASE_MAX_COST_USD"
      - name: Download exact prior published wheel
        run: |
          mkdir -p prior-dist
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            'https://files.pythonhosted.org/packages/95/f0/cea9213040f78222a3c5bcfe47b8f90be2ef7f9fd50af76ebb22dcb9f2ad/codeprobe-0.11.0-py3-none-any.whl' \
            --output prior-dist/codeprobe-0.11.0-py3-none-any.whl
          echo 'a7797a1f4be4a6b4bd9ce73cb4ac868d8e26e2d4a23a3ecda040ee19105bfbf5  prior-dist/codeprobe-0.11.0-py3-none-any.whl' \
            | sha256sum --check --strict
      - name: Prior-release-to-candidate upgrade compatibility
        run: >-
          python scripts/e2e/upgrade_compatibility.py
          --prior-wheel prior-dist/codeprobe-0.11.0-py3-none-any.whl
          --candidate-wheel candidate-dist/codeprobe-*.whl
      # Acceptance readiness + fresh staging smoke. Its internal rebuild is
      # isolated from dist/, whose wheel bytes came from e2e-enterprise.
      - run: >-
          python scripts/release_gate.py
          --evidence-dir acceptance/release-verdicts
          --expected-version "${GITHUB_REF_NAME#v}"
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dist-checked
          path: candidate-dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [gate]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dist-checked
          path: dist/
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install twine
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.CODEPROBE }}
