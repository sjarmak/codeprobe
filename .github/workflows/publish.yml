name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # INV2 tenant guard: derive_tenant() fail-louds when CI=true and no tenant
      # is set. Set it explicitly so the guard fires only for user error, not
      # for our own test suite. Tests that exercise the guard itself override
      # via monkeypatch and are unaffected.
      - run: pytest --cov=src/codeprobe --cov-report=term-missing --cov-fail-under=80
        env:
          CODEPROBE_TENANT: ci-${{ github.sha }}

  # The self-serve acceptance exit gate (codeprobe-f7rl.46). Same job as
  # ci.yml's e2e-self-serve, duplicated here rather than cross-referenced:
  # GitHub Actions `needs:` can only depend on jobs within the same
  # workflow file, so a release-blocking copy has to live in this
  # workflow too. Locked decision 8: no release ships without this green.
  e2e-self-serve:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/e2e/self_serve_acceptance.py

  # Builds dist/ exactly once and checks its content/version/changelog
  # invariants, then immediately uploads those checked bytes as a workflow
  # artifact — before release_gate.py runs. release_gate.py's
  # ReleaseGate.build_and_stage() rebuilds the wheel internally as part of
  # its own install/smoke-test cycle (python -m build wheel output is not
  # byte-reproducible between invocations even against an unchanged source
  # tree), so it must never run before the upload step, or the artifact
  # would silently capture an unchecked rebuild instead of the wheel
  # check_release_artifacts.py actually validated. `publish` downloads this
  # artifact rather than rebuilding, so the bytes twine uploads are the
  # exact bytes this job checked.
  gate:
    needs: [test, e2e-self-serve]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_release_artifacts.py dist/ --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
      # Smoke-test only, past this point: proves a clean build/install still
      # works. Its own internal rebuild must not feed the published artifact
      # (see comment above) — the upload already happened.
      - run: python scripts/release_gate.py

  publish:
    needs: [gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install twine
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.CODEPROBE }}
