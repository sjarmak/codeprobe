name: Publish OCI Images

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-oci-images-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ${{ vars.CODEPROBE_OCI_REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.CODEPROBE_OCI_NAMESPACE || github.repository }}
  QEMU_BINFMT_IMAGE: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  BUILDX_VERSION: v0.35.0
  BUILDKIT_IMAGE: moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  SCOUT_SBOM_INDEXER_IMAGE: docker/scout-sbom-indexer:1@sha256:3579229a5ace351e4511903f3da976304990339da1c49a3cc0f00bcd7d793181
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  TRIVY_SEVERITY: ${{ vars.CODEPROBE_OCI_TRIVY_SEVERITY || 'CRITICAL,HIGH' }}
  ORAS_VERSION: 1.3.3
  UV_VERSION: 0.12.0
  DEBIAN_SNAPSHOT: 20260728T000000Z
  CLAUDE_CODE_VERSION: 2.1.220
  CLAUDE_CODE_INTEGRITY: sha512-ogBrvwkqF9f8okmnXKxmRNHuvtFxFEffe5pWdqOV3iQDxlUOKirFqnyWC7NGXXnDA4WkkbPH8pvSbwyCR2Auyw==

jobs:
  authorize-release:
    runs-on: ubuntu-22.04
    environment: release-images
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.authority.outputs.release_sha }}
      version: ${{ steps.authority.outputs.version }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize tag target from main
        id: authority
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}")
          EVENT_COMMIT=$(git rev-parse "${GITHUB_SHA}^{commit}")
          test "$TAG_COMMIT" = "$EVENT_COMMIT"
          git rev-parse --verify refs/remotes/origin/main^{commit} >/dev/null
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          export TAG_COMMIT
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"tag {tag!r} does not start with v")

          tag_version = tag[1:]
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", tag_version):
              raise SystemExit(f"tag version {tag_version!r} is not an OCI tag")
          if tag_version == "latest":
              raise SystemExit("release tag must not resolve to latest")

          project = tomllib.loads(Path("pyproject.toml").read_text())
          project_version = project["project"]["version"]
          if tag_version != project_version:
              raise SystemExit(
                  f"pyproject.toml version {project_version} does not match tag {tag}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"release_sha={os.environ['TAG_COMMIT']}", file=output)
              print(f"version={tag_version}", file=output)
          PY

  reuse-release:
    runs-on: ubuntu-22.04
    needs: [authorize-release]
    environment: release-images
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install locked Python dependencies
        run: uv sync --frozen --no-dev

      # oras-project/setup-oras v2.0.1
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: ${{ env.ORAS_VERSION }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # sigstore/cosign-installer v4.1.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2

      - name: Resolve registry credentials
        id: registry-auth
        env:
          REGISTRY_USERNAME: ${{ vars.CODEPROBE_OCI_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CODEPROBE_OCI_TOKEN }}
          DEFAULT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_workflow_inputs credentials \
            --registry "$REGISTRY" \
            --namespace "$IMAGE_NAMESPACE" \
            --github-output "$GITHUB_OUTPUT"

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.registry-auth.outputs.username }}
          password: ${{ steps.registry-auth.outputs.password }}

      - name: Verify existing release-pair authority
        id: reuse
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/tags/${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          TRIVY_USERNAME: ${{ steps.registry-auth.outputs.username }}
          TRIVY_PASSWORD: ${{ steps.registry-auth.outputs.password }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_release check-reuse \
            --registry "$REGISTRY" \
            --namespace "$IMAGE_NAMESPACE" \
            --version "${{ needs.authorize-release.outputs.version }}" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --source-sha "${{ needs.authorize-release.outputs.release_sha }}" \
            --cert-identity "$CERT_IDENTITY" \
            --output-dir release-reuse \
            --trivy-image "$TRIVY_IMAGE" \
            --trivy-severity "$TRIVY_SEVERITY"

      - name: Upload release reuse evidence
        if: steps.reuse.outputs.reuse == 'true'
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-release-reuse-${{ github.ref_name }}
          path: release-reuse/
          if-no-files-found: error

  build-candidate-images:
    runs-on: ubuntu-22.04
    needs: [authorize-release, reuse-release]
    if: needs.reuse-release.outputs.reuse != 'true'
    environment: release-images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: codeprobe-agent
            dockerfile: src/codeprobe/sandbox/Dockerfile.agent
            override_env: CODEPROBE_AGENT_IMAGE
          - image: codeprobe-scoring
            dockerfile: src/codeprobe/sandbox/Dockerfile.scoring
            override_env: CODEPROBE_SCORING_IMAGE

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install locked Python dependencies
        run: uv sync --frozen --no-dev

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          image: ${{ env.QEMU_BINFMT_IMAGE }}
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Resolve image references
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          VERSION: ${{ needs.authorize-release.outputs.version }}
          RELEASE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_workflow_inputs image-refs \
            --registry "$REGISTRY" \
            --namespace "$IMAGE_NAMESPACE" \
            --image "$IMAGE_NAME" \
            --version "$VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve registry credentials
        id: registry-auth
        env:
          REGISTRY_USERNAME: ${{ vars.CODEPROBE_OCI_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CODEPROBE_OCI_TOKEN }}
          DEFAULT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_workflow_inputs credentials \
            --registry "$REGISTRY" \
            --namespace "$IMAGE_NAMESPACE" \
            --github-output "$GITHUB_OUTPUT"

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.registry-auth.outputs.username }}
          password: ${{ steps.registry-auth.outputs.password }}

      # oras-project/setup-oras v2.0.1
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: ${{ env.ORAS_VERSION }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.candidate_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.authorize-release.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.authorize-release.outputs.version }}
          build-args: |
            DEBIAN_SNAPSHOT=${{ env.DEBIAN_SNAPSHOT }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            CLAUDE_CODE_INTEGRITY=${{ env.CLAUDE_CODE_INTEGRITY }}
          sbom: generator=${{ env.SCOUT_SBOM_INDEXER_IMAGE }}
          provenance: mode=max

      - name: Capture candidate digest identity
        id: identity
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "FATAL: build digest is not sha256: $DIGEST" >&2; exit 1 ;;
          esac
          echo "digest_ref=${IMAGE_REF}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Vulnerability policy scan for each platform
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          TRIVY_USERNAME: ${{ steps.registry-auth.outputs.username }}
          TRIVY_PASSWORD: ${{ steps.registry-auth.outputs.password }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            timeout 600s docker run --rm \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=256 \
              --memory=4g \
              --memory-swap=4g \
              --cpus=2 \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
              --tmpfs /root/.cache:rw,nosuid,nodev,size=2g \
              -e TRIVY_USERNAME \
              -e TRIVY_PASSWORD \
              "$TRIVY_IMAGE" image \
              --ignore-unfixed \
              --exit-code 1 \
              --severity "$TRIVY_SEVERITY" \
              --platform "$platform" \
              "$DIGEST_REF"
          done

      - name: Verify BuildKit SBOM and provenance attestations
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}
          CANDIDATE_REF: ${{ steps.image.outputs.candidate_ref }}
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_attestations \
            --image-ref "$IMAGE_REF" \
            --candidate-ref "$CANDIDATE_REF" \
            --digest-ref "$DIGEST_REF"

      # actions/attest v4.2.0
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify GitHub provenance attestation
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/tags/${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
        run: |
          gh attestation verify "oci://${DIGEST_REF}" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$CERT_IDENTITY" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --source-ref "refs/tags/${GITHUB_REF_NAME}" \
            --source-digest "$SOURCE_SHA" \
            --bundle-from-oci

      # sigstore/cosign-installer v4.1.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2

      - name: Keyless sign digest
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
        run: |
          cosign sign --yes "$DIGEST_REF"

      - name: Verify keyless signature
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$DIGEST_REF"

      - name: Record digest identity
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_REF: ${{ steps.image.outputs.name }}
          VERSION_REF: ${{ steps.image.outputs.version_ref }}
          CANDIDATE_REF: ${{ steps.image.outputs.candidate_ref }}
          VERSION: ${{ needs.authorize-release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          OVERRIDE_ENV: ${{ matrix.override_env }}
          SOURCE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
        run: |
          mkdir -p oci-identities
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = {
              "schema_version": 1,
              "image": os.environ["IMAGE_NAME"],
              "version": os.environ["VERSION"],
              "tag_ref": os.environ["VERSION_REF"],
              "candidate_ref": os.environ["CANDIDATE_REF"],
              "digest": os.environ["DIGEST"],
              "digest_ref": os.environ["DIGEST_REF"],
              "platforms": ["linux/amd64", "linux/arm64"],
              "runtime_override_env": os.environ["OVERRIDE_ENV"],
              "source_sha": os.environ["SOURCE_SHA"],
          }
          path = Path("oci-identities") / f"{os.environ['IMAGE_NAME']}.json"
          path.write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-image-identity-${{ matrix.image }}
          path: oci-identities/${{ matrix.image }}.json
          if-no-files-found: error

      - name: Quarantine failed candidate tag
        if: (failure() || cancelled()) && steps.image.outputs.candidate_ref != ''
        env:
          IMAGE_NAME: ${{ matrix.image }}
          VERSION: ${{ needs.authorize-release.outputs.version }}
          CANDIDATE_REF: ${{ steps.image.outputs.candidate_ref }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          SOURCE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_candidate_cleanup \
            --candidate-ref "$CANDIDATE_REF" \
            --image "$IMAGE_NAME" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --build-digest "$BUILD_DIGEST" \
            --digest-ref "$DIGEST_REF" \
            --output-dir candidate-quarantine

      - name: Upload candidate cleanup quarantine evidence
        if: always() && hashFiles('candidate-quarantine/candidate-quarantine.json') != ''
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-candidate-quarantine-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-quarantine/
          if-no-files-found: error

  cleanup-unpromoted-candidates:
    runs-on: ubuntu-22.04
    needs: [authorize-release, reuse-release, build-candidate-images]
    if: >-
      always() &&
      needs.authorize-release.result == 'success' &&
      needs.reuse-release.result == 'success' &&
      needs.reuse-release.outputs.reuse != 'true' &&
      needs.build-candidate-images.result != 'success'
    environment: release-images
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install locked Python dependencies
        run: uv sync --frozen --no-dev

      # oras-project/setup-oras v2.0.1
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Resolve registry credentials
        id: registry-auth
        env:
          REGISTRY_USERNAME: ${{ vars.CODEPROBE_OCI_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CODEPROBE_OCI_TOKEN }}
          DEFAULT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_workflow_inputs credentials \
            --registry "$REGISTRY" \
            --namespace "$IMAGE_NAMESPACE" \
            --github-output "$GITHUB_OUTPUT"

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.registry-auth.outputs.username }}
          password: ${{ steps.registry-auth.outputs.password }}

      - name: Quarantine unpromoted run candidates
        env:
          VERSION: ${{ needs.authorize-release.outputs.version }}
          SOURCE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
        run: |
          rc=0
          short_sha="${SOURCE_SHA::12}"
          for image in codeprobe-agent codeprobe-scoring; do
            raw="${REGISTRY}/${IMAGE_NAMESPACE}/${image}"
            repo="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]')"
            candidate="${repo}:${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
            uv run --frozen --no-dev python -m codeprobe.sandbox.oci_candidate_cleanup \
              --candidate-ref "$candidate" \
              --image "$image" \
              --version "$VERSION" \
              --source-sha "$SOURCE_SHA" \
              --build-digest "" \
              --digest-ref "" \
              --output-dir "candidate-quarantine/${image}" || rc=1
          done
          exit "$rc"

      - name: Upload aggregate candidate quarantine evidence
        if: always() && hashFiles('candidate-quarantine/**/candidate-quarantine.json') != ''
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-candidate-quarantine-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-quarantine/
          if-no-files-found: error

  promote-images:
    runs-on: ubuntu-22.04
    needs: [build-candidate-images, authorize-release, reuse-release]
    if: needs.reuse-release.outputs.reuse != 'true'
    environment: release-images
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install locked Python dependencies
        run: uv sync --frozen --no-dev

      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: oci-image-identity-*
          path: oci-identities
          merge-multiple: true

      # sigstore/cosign-installer v4.1.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2

      # oras-project/setup-oras v2.0.1
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: ${{ env.ORAS_VERSION }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Resolve registry credentials
        id: registry-auth
        env:
          REGISTRY_USERNAME: ${{ vars.CODEPROBE_OCI_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CODEPROBE_OCI_TOKEN }}
          DEFAULT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_workflow_inputs credentials \
            --registry "$REGISTRY" \
            --namespace "$IMAGE_NAMESPACE" \
            --github-output "$GITHUB_OUTPUT"

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.registry-auth.outputs.username }}
          password: ${{ steps.registry-auth.outputs.password }}

      - name: Promote pair-level immutable version tags
        id: version-tags
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_release promote-tags \
            --identity-dir oci-identities \
            --state-path promotion-state.json \
            --registry "$REGISTRY" \
            --namespace "$IMAGE_NAMESPACE" \
            --version "${{ needs.authorize-release.outputs.version }}" \
            --source-sha "${{ needs.authorize-release.outputs.release_sha }}"

      - name: Create, sign, and publish release pair authority
        if: success()
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/tags/${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_release publish-pair \
            --identity-dir oci-identities \
            --promotion-state-path promotion-state.json \
            --registry "$REGISTRY" \
            --namespace "$IMAGE_NAMESPACE" \
            --version "${{ needs.authorize-release.outputs.version }}" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --source-sha "$RELEASE_SHA" \
            --cert-identity "$CERT_IDENTITY" \
            --output-dir release-pair

      - name: Quarantine partial promotion on failure
        if: (failure() || cancelled()) && hashFiles('promotion-state.json') != ''
        env:
          RELEASE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
        run: |
          uv run --frozen --no-dev python -m codeprobe.sandbox.oci_release quarantine-promotion \
            --identity-dir oci-identities \
            --output-path promotion-quarantine.json \
            --source-sha "$RELEASE_SHA"

      - name: Upload promotion quarantine evidence
        if: always() && hashFiles('promotion-quarantine.json') != ''
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-release-pair-quarantine-${{ github.ref_name }}
          path: |
            promotion-state.json
            promotion-quarantine.json
          if-no-files-found: error

      - name: Upload release pair evidence
        if: success()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-release-pair-${{ github.ref_name }}
          path: |
            release-pair/release-pair.json
            release-pair/release-pair.bundle
            release-pair/release-pair-ref.json
            promotion-state.json
          if-no-files-found: error
