name: Publish OCI Images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ${{ vars.CODEPROBE_OCI_REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.CODEPROBE_OCI_NAMESPACE || github.repository }}
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500
  TRIVY_SEVERITY: ${{ vars.CODEPROBE_OCI_TRIVY_SEVERITY || 'CRITICAL,HIGH' }}

jobs:
  publish-images:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: codeprobe-agent
            dockerfile: src/codeprobe/sandbox/Dockerfile.agent
            override_env: CODEPROBE_AGENT_IMAGE
          - image: codeprobe-scoring
            dockerfile: src/codeprobe/sandbox/Dockerfile.scoring
            override_env: CODEPROBE_SCORING_IMAGE

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Check tag and package version
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"tag {tag!r} does not start with v")

          tag_version = tag[1:]
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", tag_version):
              raise SystemExit(f"tag version {tag_version!r} is not an OCI tag")
          if tag_version == "latest":
              raise SystemExit("release tag must not resolve to latest")

          project = tomllib.loads(Path("pyproject.toml").read_text())
          project_version = project["project"]["version"]
          if tag_version != project_version:
              raise SystemExit(
                  f"pyproject.toml version {project_version} does not match tag {tag}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={tag_version}", file=output)
          PY

      - name: Resolve image references
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          raw="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}"
          image_ref="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          candidate_tag="${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
          {
            echo "name=${image_ref}"
            echo "version_ref=${image_ref}:${VERSION}"
            echo "candidate_ref=${image_ref}:${candidate_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve registry credentials
        id: registry-auth
        env:
          REGISTRY_USERNAME: ${{ vars.CODEPROBE_OCI_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CODEPROBE_OCI_TOKEN }}
          DEFAULT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          username="${REGISTRY_USERNAME}"
          password="${REGISTRY_PASSWORD}"
          if [ "$REGISTRY" = "ghcr.io" ]; then
            username="${username:-$GITHUB_ACTOR}"
            password="${password:-$DEFAULT_GITHUB_TOKEN}"
          elif [ -z "$username" ] || [ -z "$password" ]; then
            echo "FATAL: CODEPROBE_OCI_USERNAME and CODEPROBE_OCI_TOKEN are required for non-ghcr.io registries." >&2
            exit 1
          fi
          if [ -z "$username" ] || [ -z "$password" ]; then
            echo "FATAL: registry credentials resolved empty." >&2
            exit 1
          fi
          echo "::add-mask::$password"
          {
            echo "username=${username}"
            echo "password=${password}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.registry-auth.outputs.username }}
          password: ${{ steps.registry-auth.outputs.password }}

      - name: Refuse existing immutable version tag
        env:
          VERSION_REF: ${{ steps.image.outputs.version_ref }}
        run: |
          if docker buildx imagetools inspect "$VERSION_REF" >/tmp/codeprobe-version-tag.out 2>/tmp/codeprobe-version-tag.err; then
            echo "FATAL: version image tag already exists: $VERSION_REF" >&2
            exit 1
          fi
          if ! grep -Eiq '(not found|manifest unknown|name unknown)' /tmp/codeprobe-version-tag.err; then
            cat /tmp/codeprobe-version-tag.err >&2
            echo "FATAL: could not prove version tag is absent: $VERSION_REF" >&2
            exit 1
          fi

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.candidate_ref }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Capture candidate digest identity
        id: identity
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "FATAL: build digest is not sha256: $DIGEST" >&2; exit 1 ;;
          esac
          echo "digest_ref=${IMAGE_REF}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Vulnerability policy scan for each platform
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          TRIVY_USERNAME: ${{ steps.registry-auth.outputs.username }}
          TRIVY_PASSWORD: ${{ steps.registry-auth.outputs.password }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm \
              -e TRIVY_USERNAME \
              -e TRIVY_PASSWORD \
              "$TRIVY_IMAGE" image \
              --ignore-unfixed \
              --exit-code 1 \
              --severity "$TRIVY_SEVERITY" \
              --platform "$platform" \
              "$DIGEST_REF"
          done

      - name: Verify BuildKit SBOM and provenance attestations
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          required_platforms = {"linux/amd64", "linux/arm64"}
          required_predicates = {
              "https://spdx.dev/Document",
              "https://slsa.dev/provenance/",
          }
          image_ref = os.environ["IMAGE_REF"]
          digest_ref = os.environ["DIGEST_REF"]

          def raw(ref: str) -> dict[str, object]:
              completed = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", "--raw", ref],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              loaded = json.loads(completed.stdout)
              if not isinstance(loaded, dict):
                  raise SystemExit(f"{ref} did not resolve to a JSON object")
              return loaded

          index = raw(digest_ref)
          manifests = index.get("manifests")
          if not isinstance(manifests, list):
              raise SystemExit("pushed image is not a manifest list")

          platform_digests: dict[str, str] = {}
          attestation_subjects: dict[str, str | None] = {}
          for manifest in manifests:
              if not isinstance(manifest, dict):
                  continue
              digest = manifest.get("digest")
              platform = manifest.get("platform")
              annotations = manifest.get("annotations") or {}
              if not isinstance(digest, str) or not isinstance(platform, dict):
                  continue
              key = f"{platform.get('os')}/{platform.get('architecture')}"
              if key in required_platforms:
                  platform_digests[digest] = key
              if (
                  isinstance(annotations, dict)
                  and annotations.get("vnd.docker.reference.type")
                  == "attestation-manifest"
              ):
                  subject_digest = annotations.get("vnd.docker.reference.digest")
                  attestation_subjects[digest] = (
                      subject_digest if isinstance(subject_digest, str) else None
                  )

          found_platforms = set(platform_digests.values())
          missing = required_platforms - found_platforms
          if missing:
              raise SystemExit(f"missing platform manifests: {sorted(missing)}")

          predicates_by_platform = {platform: set() for platform in required_platforms}
          for digest, descriptor_subject in attestation_subjects.items():
              attestation = raw(f"{image_ref}@{digest}")
              subject = attestation.get("subject") or {}
              subject_digest = descriptor_subject
              if isinstance(subject, dict):
                  manifest_subject = subject.get("digest")
                  if isinstance(manifest_subject, str):
                      subject_digest = manifest_subject
              layers = attestation.get("layers") or []
              if not isinstance(layers, list):
                  continue
              platform = platform_digests.get(subject_digest)
              if platform is None:
                  continue
              for layer in layers:
                  if not isinstance(layer, dict):
                      continue
                  annotations = layer.get("annotations") or {}
                  if not isinstance(annotations, dict):
                      continue
                  predicate = annotations.get("in-toto.io/predicate-type")
                  if isinstance(predicate, str):
                      predicates_by_platform[platform].add(predicate)

          failures: list[str] = []
          for platform, predicates in predicates_by_platform.items():
              for required in required_predicates:
                  if not any(value.startswith(required) for value in predicates):
                      failures.append(f"{platform} missing {required}")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY

      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify GitHub provenance attestation
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/tags/${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${DIGEST_REF}" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$CERT_IDENTITY" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --source-ref "refs/tags/${GITHUB_REF_NAME}" \
            --source-digest "$GITHUB_SHA" \
            --bundle-from-oci

      - uses: sigstore/cosign-installer@0f983226cbf1ee0368469d3e2b33417ceec4c225
        with:
          cosign-release: v3.0.2

      - name: Keyless sign digest
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
        run: |
          cosign sign --yes "$DIGEST_REF"

      - name: Verify keyless signature
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$DIGEST_REF"

      - name: Promote immutable version tag
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          VERSION_REF: ${{ steps.image.outputs.version_ref }}
        run: |
          docker buildx imagetools create --tag "$VERSION_REF" "$DIGEST_REF"
          docker buildx imagetools inspect "$VERSION_REF" | tee /tmp/codeprobe-promoted-image.txt
          grep -F "Digest:    ${DIGEST_REF#*@}" /tmp/codeprobe-promoted-image.txt

      - name: Record digest identity
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_REF: ${{ steps.image.outputs.name }}
          VERSION_REF: ${{ steps.image.outputs.version_ref }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          OVERRIDE_ENV: ${{ matrix.override_env }}
        run: |
          mkdir -p oci-identities
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = {
              "schema_version": 1,
              "image": os.environ["IMAGE_NAME"],
              "version": os.environ["VERSION"],
              "tag_ref": os.environ["VERSION_REF"],
              "digest": os.environ["DIGEST"],
              "digest_ref": os.environ["DIGEST_REF"],
              "platforms": ["linux/amd64", "linux/arm64"],
              "runtime_override_env": os.environ["OVERRIDE_ENV"],
          }
          path = Path("oci-identities") / f"{os.environ['IMAGE_NAME']}.json"
          path.write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-image-identity-${{ matrix.image }}
          path: oci-identities/${{ matrix.image }}.json
          if-no-files-found: error
