name: Publish OCI Images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ${{ vars.CODEPROBE_OCI_REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.CODEPROBE_OCI_NAMESPACE || github.repository }}
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.71.0
  TRIVY_SEVERITY: ${{ vars.CODEPROBE_OCI_TRIVY_SEVERITY || 'CRITICAL,HIGH' }}

jobs:
  publish-images:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: codeprobe-agent
            dockerfile: src/codeprobe/sandbox/Dockerfile.agent
            override_env: CODEPROBE_AGENT_IMAGE
          - image: codeprobe-scoring
            dockerfile: src/codeprobe/sandbox/Dockerfile.scoring
            override_env: CODEPROBE_SCORING_IMAGE

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Check tag and package version
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"tag {tag!r} does not start with v")

          tag_version = tag[1:]
          project = tomllib.loads(Path("pyproject.toml").read_text())
          project_version = project["project"]["version"]
          if tag_version != project_version:
              raise SystemExit(
                  f"pyproject.toml version {project_version} does not match tag {tag}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={tag_version}", file=output)
          PY

      - name: Resolve image reference
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          raw="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}"
          image_ref="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]')"
          {
            echo "name=${image_ref}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.CODEPROBE_OCI_USERNAME || github.actor }}
          password: ${{ secrets.CODEPROBE_OCI_TOKEN || github.token }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Record digest identity
        id: identity
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_REF: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          OVERRIDE_ENV: ${{ matrix.override_env }}
        run: |
          test -n "$DIGEST"
          mkdir -p oci-identities
          DIGEST_REF="${IMAGE_REF}@${DIGEST}"
          export DIGEST_REF
          echo "digest_ref=${DIGEST_REF}" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = {
              "schema_version": 1,
              "image": os.environ["IMAGE_NAME"],
              "version": os.environ["VERSION"],
              "tag_ref": f"{os.environ['IMAGE_REF']}:{os.environ['VERSION']}",
              "digest": os.environ["DIGEST"],
              "digest_ref": os.environ["DIGEST_REF"],
              "platforms": ["linux/amd64", "linux/arm64"],
              "runtime_override_env": os.environ["OVERRIDE_ENV"],
          }
          path = Path("oci-identities") / f"{os.environ['IMAGE_NAME']}.json"
          path.write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Vulnerability policy scan
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          docker run --rm \
            -e TRIVY_USERNAME \
            -e TRIVY_PASSWORD \
            "$TRIVY_IMAGE" image \
            --ignore-unfixed \
            --exit-code 1 \
            --severity "$TRIVY_SEVERITY" \
            "$DIGEST_REF"

      - uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.0.2

      - name: Keyless sign digest
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
        run: |
          cosign sign --yes "$DIGEST_REF"

      - name: Verify keyless signature
        env:
          DIGEST_REF: ${{ steps.identity.outputs.digest_ref }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$DIGEST_REF"

      - uses: actions/upload-artifact@v4
        with:
          name: oci-image-identity-${{ matrix.image }}
          path: oci-identities/${{ matrix.image }}.json
          if-no-files-found: error
