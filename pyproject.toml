[project]
name = "codeprobe"
version = "0.13.0"
description = "Benchmark AI coding agents against your own codebase. Mine real tasks from repo history, run agents, interpret results."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "codeprobe contributors" },
]
keywords = ["ai", "benchmark", "eval", "coding-agent", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0,<9",
    "pyyaml>=6.0,<7",
    "anthropic>=0.39,<1",
    "openai>=1.66,<3",
    "tiktoken>=0.7,<1",
    "scipy>=1.11,<2",
    "rich>=13.7,<14",
    "jinja2>=3.1,<4",
    "docker-image-py>=0.2,<0.3",
]

[project.urls]
Homepage = "https://github.com/sjarmak/codeprobe"
Repository = "https://github.com/sjarmak/codeprobe"
Issues = "https://github.com/sjarmak/codeprobe/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    # Pinned to a minor range, not >=0.4,<1: ruff adds lint rules in minor
    # releases, so an open range turns CI red with no code change (codeprobe-pb4z
    # — 35 errors accumulated this way). Bump deliberately and fix the new rules
    # in the same commit.
    "ruff>=0.15,<0.16",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
    "types-requests>=2.31,<3",
    "scipy-stubs>=1.11,<2",
    "scipy>=1.11,<2",
    # Needed by tests/test_release_gate.py::test_build_and_stage_real_wheel
    # which shells out to ``python -m build --wheel`` to verify the wheel
    # produced at release time is installable and version-consistent.
    "build>=1.0,<2",
]

[project.scripts]
codeprobe = "codeprobe.cli:main"

[project.entry-points."codeprobe.agents"]
claude = "codeprobe.adapters.claude:ClaudeAdapter"
codex = "codeprobe.adapters.codex:CodexAdapter"
copilot = "codeprobe.adapters.copilot:CopilotAdapter"

[project.entry-points."codeprobe.sessions"]
claude = "codeprobe.adapters.session:ClaudeSessionCollector"
codex = "codeprobe.adapters.session:CodexSessionCollector"
copilot = "codeprobe.adapters.session:CopilotSessionCollector"

[project.entry-points."codeprobe.scorers"]
binary = "codeprobe.core.scoring:BinaryScorer"
continuous = "codeprobe.core.scoring:ContinuousScorer"
checkpoint = "codeprobe.core.scoring:CheckpointScorer"
test_ratio = "codeprobe.core.scoring:ContinuousScorer"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codeprobe.preambles" = ["*.md", "*.j2"]
# Subpackage holding Jinja preamble templates loaded at runtime via
# FileSystemLoader (see codeprobe/preambles/templates/__init__.py). Must be
# listed explicitly — setuptools package-data is per-package, not recursive.
"codeprobe.preambles.templates" = ["*.j2", "*.md.j2"]
"codeprobe.templates" = ["*.yaml"]
"codeprobe.llm" = ["*.yaml"]
"codeprobe.cli" = ["error_codes.json"]
# Embedded Go AST scanner sourced at runtime by AstResolver via `go run`.
# Single-file program with no external deps; ships as plain text and is
# compiled on-demand by the user's local go toolchain.
"codeprobe.mining._go_ast_scanner" = ["*.go"]
# Shipped agent skills (see PRD §7). The canonical copies live in-tree at
# src/codeprobe/skills_data/codeprobe-*/SKILL.md so this glob covers both the
# wheel and the sdist; `codeprobe skills install` materializes them for
# customers. The .claude/skills/codeprobe-*/SKILL.md files are byte-identical
# mirrors for this repo's own agents and are NOT packaged — never add a graft
# or recursive-include for .claude/, which would sweep whatever machine-local
# agent skills the build host happens to have into a public sdist.
"codeprobe.skills_data" = ["*/SKILL.md"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: cross-component or external-service checks (included in default pytest and CI runs)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = false

# numpy (>=2.5) and scipy-stubs ship PEP 695 ``type`` alias statements (3.12+
# syntax) that mypy rejects while checking under ``python_version = 3.11`` — the
# whole run aborts with "Type statement is only supported in Python 3.12 and
# greater" even though no codeprobe code is at fault (a fresh ``pip install``
# pulls whatever numpy / scipy-stubs resolve to, e.g. numpy 2.5.1). Neither is
# imported directly; codeprobe only touches ``scipy.stats`` in analysis/stats.py
# and assess/oracle_diff.py, and numpy comes in transitively. Skip following
# both stub trees instead of pinning versions that will drift again. Remove once
# the floor mypy version parses these stubs cleanly.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N802 — one intentional mixed-case test method name asserting on camelCase
# flag forwarding (``--disallowedTools``).
# UP028/UP042 — one-off modernizations not worth the churn in this release.
# (N818 was removed in codeprobe-6c9 — all exception classes now carry the
# ``Error`` suffix, with deprecated aliases for one minor-version cycle.)
ignore = ["N802", "UP028", "UP042"]

[tool.ruff.lint.per-file-ignores]
# One stale local var + one unused-but-kept-for-shape helper in existing tests.
"tests/test_verify.py" = ["F841"]
# Pre-existing alias intentionally re-exports the registry under a private name;
# ruff's explicit-re-export suggestion would be a larger refactor.
"src/codeprobe/cli/__init__.py" = ["F401"]
# Wide HTML template string that reads better on one line than broken up.
"src/codeprobe/snapshot/exporters/browse.py" = ["E501"]
# Same: the self-contained run-explorer HTML/JS template (codeprobe-3cs).
"src/codeprobe/analysis/run_explorer.py" = ["E501"]
# Same: the arm-vs-arm comparison-viewer HTML/JS template (codeprobe-00e).
"src/codeprobe/analysis/comparison_viewer.py" = ["E501"]
